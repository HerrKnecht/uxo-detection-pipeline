[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "uxo-detection-pipeline"
version = "0.1.0"
description = "Pipeline for unexploded ordnance (UXO) detection and classification from geophysical survey data"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Henrik Schygulla" }]
requires-python = ">=3.10"
keywords = ["uxo", "unexploded-ordnance", "geophysics", "magnetometry", "borehole",
            "synthetic-data", "machine-learning"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Scientific/Engineering :: Physics",
    "Intended Audience :: Science/Research",
    "Development Status :: 3 - Alpha",
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "pandas>=2.0",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
ml = ["scikit-learn>=1.3", "xgboost>=2.0"]
dl = ["torch>=2.1"]
dev = ["pytest>=7", "jupyter"]

[project.urls]
Repository = "https://github.com/HerrKnecht/uxo-detection-pipeline"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
